<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password Brevo OTP Terminal — History Podcast</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #0B0D14;
      --bg-card: #131622;
      --bg-card-hover: #181C2B;
      --bg-input: #0E1019;
      --bg-inner: #08090E;

      --border-subtle: #23283A;
      --border-highlight: #353D57;
      --border-focus: #38BDF8;

      --text-white: #FFFFFF;
      --text-heading: #F8FAFC;
      --text-body: #CBD5E1;
      --text-dim: #8492A6;
      --text-muted: #4B5565;

      --cyan-base: #38BDF8;
      --cyan-glow: rgba(56, 189, 248, 0.15);
      --cyan-border: rgba(56, 189, 248, 0.35);

      --emerald-base: #10B981;
      --emerald-glow: rgba(16, 185, 129, 0.15);
      --emerald-border: rgba(16, 185, 129, 0.35);

      --rose-base: #F43F5E;
      --rose-glow: rgba(244, 63, 94, 0.15);
      --rose-border: rgba(244, 63, 94, 0.35);

      --amber-base: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.15);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-base);
      color: var(--text-body);
      font-family: 'Space Grotesk', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header {
      text-align: center;
      margin-bottom: 8px;
    }

    .badge-brevo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid var(--emerald-border);
      color: var(--emerald-base);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .badge-brevo .dot {
      width: 8px;
      height: 8px;
      background-color: var(--emerald-base);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--emerald-base);
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-heading);
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: 14px;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .step-box {
      border: 1px solid var(--border-subtle);
      background: var(--bg-inner);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s;
    }

    .step-box.active {
      border-color: var(--cyan-border);
      box-shadow: 0 0 16px var(--cyan-glow);
    }

    .step-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-num {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--cyan-base);
      color: #000;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
    }

    .step-num.completed {
      background: var(--emerald-base);
      color: #fff;
    }

    .step-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-heading);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: var(--text-white);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--cyan-base);
      box-shadow: 0 0 0 2px var(--cyan-glow);
    }

    .btn {
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      font-family: inherit;
    }

    .btn-primary {
      background: var(--cyan-base);
      color: #04121A;
    }

    .btn-primary:hover:not(:disabled) {
      background: #70D1FA;
      box-shadow: 0 0 14px var(--cyan-glow);
    }

    .btn-secondary {
      background: #1C2333;
      color: var(--text-body);
      border: 1px solid var(--border-highlight);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #252F45;
      color: var(--text-white);
    }

    .btn-success {
      background: var(--emerald-base);
      color: #022013;
    }

    .btn-success:hover:not(:disabled) {
      background: #34D399;
      box-shadow: 0 0 14px var(--emerald-glow);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Terminal Console */
    .terminal-card {
      background: var(--bg-inner);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
    }

    .terminal-header {
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-subtle);
      padding: 10px 14px;
      font-size: 12px;
      color: var(--text-dim);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .terminal-dots {
      display: flex;
      gap: 6px;
    }

    .terminal-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .terminal-dot.red { background: #EF4444; }
    .terminal-dot.yellow { background: #F59E0B; }
    .terminal-dot.green { background: #10B981; }

    .terminal-logs {
      padding: 14px;
      height: 480px;
      overflow-y: auto;
      font-size: 12px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-line {
      word-break: break-all;
    }

    .log-time { color: var(--text-muted); }
    .log-info { color: var(--cyan-base); }
    .log-success { color: var(--emerald-base); }
    .log-error { color: var(--rose-base); }
    .log-json { color: #A5B4FC; }

    .cooldown-text {
      font-size: 12px;
      color: var(--amber-base);
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge-brevo">
      <span class="dot"></span>
      BREVO SMTP REST API ENGINE
    </div>
    <h1>Xác Thực Quên Mật Khẩu (OTP)</h1>
    <p class="subtitle">Kiểm thử quy trình gửi mã OTP qua Brevo Email, xác thực và đổi mật khẩu an toàn</p>
  </header>

  <div class="main-grid">
    <!-- Left form card -->
    <div class="card">
      <!-- Step 1: Input Email -->
      <div class="step-box active" id="step1Box">
        <div class="step-header">
          <div class="step-num" id="step1Num">1</div>
          <div class="step-title">Gửi mã OTP đến Email</div>
        </div>
        <div class="form-group">
          <label>Địa chỉ Email</label>
          <input type="email" id="emailInput" placeholder="nhap-email@example.com" value="admin@historypodcast.com" />
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn btn-primary" id="btnSendOtp" onclick="handleSendOtp()">
            Gửi OTP qua Brevo
          </button>
          <span id="cooldownNotice" class="cooldown-text" style="display: none;"></span>
        </div>
      </div>

      <!-- Step 2: Verify OTP -->
      <div class="step-box" id="step2Box">
        <div class="step-header">
          <div class="step-num" id="step2Num">2</div>
          <div class="step-title">Nhập mã xác thực OTP</div>
        </div>
        <div class="form-group">
          <label>Mã OTP (6 chữ số)</label>
          <input type="text" id="otpInput" maxlength="6" placeholder="Ví dụ: 123456" />
        </div>
        <div>
          <button class="btn btn-secondary" id="btnVerifyOtp" onclick="handleVerifyOtp()">
            Xác thực OTP
          </button>
        </div>
      </div>

      <!-- Step 3: Reset Password -->
      <div class="step-box" id="step3Box">
        <div class="step-header">
          <div class="step-num" id="step3Num">3</div>
          <div class="step-title">Đặt lại Mật khẩu mới</div>
        </div>
        <div class="form-group">
          <label>Mật khẩu mới (tối thiểu 6 ký tự)</label>
          <input type="password" id="newPasswordInput" placeholder="Nhập mật khẩu mới..." />
        </div>
        <div class="form-group">
          <label>Xác nhận Mật khẩu mới</label>
          <input type="password" id="confirmPasswordInput" placeholder="Nhập lại mật khẩu mới..." />
        </div>
        <div>
          <button class="btn btn-success" id="btnResetPassword" onclick="handleResetPassword()">
            Cập nhật Mật khẩu
          </button>
        </div>
      </div>
    </div>

    <!-- Right console log card -->
    <div class="terminal-card">
      <div class="terminal-header">
        <div class="terminal-dots">
          <span class="terminal-dot red"></span>
          <span class="terminal-dot yellow"></span>
          <span class="terminal-dot green"></span>
        </div>
        <span>CONSOLE OUTPUT</span>
        <button class="btn btn-secondary" style="padding: 2px 8px; font-size: 11px;" onclick="clearLogs()">Clear</button>
      </div>
      <div class="terminal-logs" id="terminalLogs">
        <div class="log-line">
          <span class="log-time">[INIT]</span>
          <span class="log-info">Hệ thống sẵn sàng. Nhập email để bắt đầu kiểm thử Brevo OTP.</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  let currentResetToken = null;
  let cooldownTimer = null;
  let cooldownSeconds = 0;

  function log(type, message, data = null) {
    const logs = document.getElementById('terminalLogs');
    const time = new Date().toLocaleTimeString();
    const div = document.createElement('div');
    div.className = 'log-line';

    let colorClass = 'log-info';
    if (type === 'SUCCESS') colorClass = 'log-success';
    if (type === 'ERROR') colorClass = 'log-error';

    let html = `<span class="log-time">[${time}]</span> <span class="${colorClass}">[${type}]</span> ${message}`;
    if (data) {
      html += `<pre class="log-json" style="margin-top:4px; font-size:11px;">${JSON.stringify(data, null, 2)}</pre>`;
    }
    div.innerHTML = html;
    logs.appendChild(div);
    logs.scrollTop = logs.scrollHeight;
  }

  function clearLogs() {
    document.getElementById('terminalLogs').innerHTML = '';
  }

  function startCooldown(seconds) {
    cooldownSeconds = seconds;
    const btn = document.getElementById('btnSendOtp');
    const notice = document.getElementById('cooldownNotice');
    btn.disabled = true;
    notice.style.display = 'inline';

    clearInterval(cooldownTimer);
    cooldownTimer = setInterval(() => {
      cooldownSeconds--;
      notice.textContent = `Chờ (${cooldownSeconds}s)`;
      if (cooldownSeconds <= 0) {
        clearInterval(cooldownTimer);
        btn.disabled = false;
        notice.style.display = 'none';
      }
    }, 1000);
  }

  async function handleSendOtp() {
    const email = document.getElementById('emailInput').value.trim();
    if (!email) {
      log('ERROR', 'Vui lòng nhập địa chỉ email hợp lệ!');
      return;
    }

    log('INFO', `POST /api/v1/auth/forgot-password với email: ${email}`);

    try {
      const response = await fetch('/api/v1/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const resData = await response.json();
      if (!response.ok) {
        log('ERROR', `Lỗi [${resData.code || response.status}]: ${resData.message || 'Không thể gửi OTP'}`);
        return;
      }

      log('SUCCESS', resData.message || 'Mã OTP đã được gửi qua Brevo!', resData);
      startCooldown(60);

      // Activate step 2
      document.getElementById('step1Num').classList.add('completed');
      document.getElementById('step2Box').classList.add('active');
      document.getElementById('otpInput').focus();
    } catch (e) {
      log('ERROR', `Không thể kết nối đến server: ${e.message}`);
    }
  }

  async function handleVerifyOtp() {
    const email = document.getElementById('emailInput').value.trim();
    const otpCode = document.getElementById('otpInput').value.trim();

    if (!otpCode || otpCode.length !== 6) {
      log('ERROR', 'Mã OTP phải có đúng 6 chữ số!');
      return;
    }

    log('INFO', `POST /api/v1/auth/verify-forgot-password-otp với mã: ${otpCode}`);

    try {
      const response = await fetch('/api/v1/auth/verify-forgot-password-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, otpCode })
      });

      const resData = await response.json();
      if (!response.ok) {
        log('ERROR', `Xác thực OTP thất bại: ${resData.message || 'Mã không đúng hoặc đã hết hạn'}`);
        return;
      }

      currentResetToken = resData.data ? resData.data.resetToken : null;
      log('SUCCESS', 'Xác thực OTP thành công! Nhận Reset Token:', resData.data);

      // Activate step 3
      document.getElementById('step2Num').classList.add('completed');
      document.getElementById('step3Box').classList.add('active');
      document.getElementById('newPasswordInput').focus();
    } catch (e) {
      log('ERROR', `Lỗi mạng khi xác thực OTP: ${e.message}`);
    }
  }

  async function handleResetPassword() {
    const email = document.getElementById('emailInput').value.trim();
    const newPassword = document.getElementById('newPasswordInput').value;
    const confirmPassword = document.getElementById('confirmPasswordInput').value;
    const otpCode = document.getElementById('otpInput').value.trim();

    if (!newPassword || newPassword.length < 6) {
      log('ERROR', 'Mật khẩu mới phải có tối thiểu 6 ký tự!');
      return;
    }

    if (newPassword !== confirmPassword) {
      log('ERROR', 'Mật khẩu mới và xác nhận mật khẩu không trùng khớp!');
      return;
    }

    log('INFO', `POST /api/v1/auth/reset-password cho email: ${email}`);

    try {
      const bodyPayload = {
        email,
        newPassword,
        confirmPassword,
        resetToken: currentResetToken,
        otpCode: currentResetToken ? undefined : otpCode
      };

      const response = await fetch('/api/v1/auth/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyPayload)
      });

      const resData = await response.json();
      if (!response.ok) {
        log('ERROR', `Đổi mật khẩu thất bại: ${resData.message}`);
        return;
      }

      log('SUCCESS', '🎉 ' + (resData.message || 'Đặt lại mật khẩu thành công!'), resData);
      document.getElementById('step3Num').classList.add('completed');
      alert('Đổi mật khẩu thành công! Bây giờ bạn có thể đăng nhập với mật khẩu mới.');
    } catch (e) {
      log('ERROR', `Lỗi mạng khi đặt lại mật khẩu: ${e.message}`);
    }
  }
</script>

</body>
</html>
