server:
  port: 8080

spring:
  application:
    name: prm-backend
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    default-property-inclusion: non_null

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prm_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET:PRM_PLATFORM_SUPER_SECRET_KEY_FOR_JWT_SIGNING_2026_VERY_SECURE}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Application Custom Integrations
app:
  email:
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:no-reply@historypodcast.com}
      sender-name: ${BREVO_SENDER_NAME:History Podcast Platform}
      api-url: https://api.brevo.com/v3/smtp/email
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    root-folder: ${CLOUDINARY_ROOT_FOLDER:history-podcast}
  firebase:
    api-key: ${FIREBASE_API_KEY:}

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
