server:
  port: 8080

spring:
  application:
    name: prm-backend
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

  jackson:
    default-property-inclusion: non_null

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prm_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    out-of-order: true
    locations: classpath:db/migration

# JWT Security Configuration
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:86400000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Application Custom Integrations
app:
  email:
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${BREVO_SENDER_EMAIL:no-reply@historypodcast.com}
      sender-name: ${BREVO_SENDER_NAME:History Podcast Platform}
      api-url: https://api.brevo.com/v3/smtp/email
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    root-folder: ${CLOUDINARY_ROOT_FOLDER:history-podcast}
  firebase:
    api-key: ${FIREBASE_API_KEY:}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMOVNPAY}
    hash-secret: ${VNPAY_HASH_SECRET:DEMOHASHSECRET1234567890ABCDEF}
    pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:3000/payment/vnpay-return}
  tool:
    url: ${TOOL_URL:http://localhost:8000}

# Creator - Freelancer Booking & Escrow Configuration
booking-escrow:
  contract-accept-hours: ${CONTRACT_ACCEPT_HOURS:48}
  fund-hours: ${FUND_HOURS:48}
  fund-pause-max-days: ${FUND_PAUSE_MAX_DAYS:7}
  review-days: ${REVIEW_DAYS:3}
  release-hold-days: ${RELEASE_HOLD_DAYS:3}
  revision-days: ${REVISION_DAYS:2}
  max-milestones: ${MAX_MILESTONES:5}
  max-revisions-default: ${MAX_REVISIONS_DEFAULT:2}
  platform-fee-percent: ${PLATFORM_FEE_PERCENT:5.0}
  job-interval-minutes: ${JOB_INTERVAL_MINUTES:60}

# SpringDoc OpenAPI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

