services:
  postgres:
    image: postgres:17-alpine
    container_name: prm-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-prm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - prm_postgres_data:/var/lib/postgresql/data

volumes:
  prm_postgres_data:
    name: prm_postgres_data
    driver: local
