services:
  # ==============================================================================
  # 1. PostgreSQL Database Service
  # ==============================================================================
  postgres:
    image: postgres:17-alpine
    container_name: prm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-prm_db}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - prm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-prm_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - prm-network

  # ==============================================================================
  # 2. Whiteboard AI Rendering Tool & RAG Service (Python)
  # ==============================================================================
  tool:
    build:
      context: ./tool
      dockerfile: Dockerfile
    container_name: prm-whiteboard-tool
    restart: unless-stopped
    env_file:
      - ./tool/.env
    environment:
      - CHROMA_DB_DIR=/app/data/chroma_db
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./tool/web_app/outputs:/app/web_app/outputs
      - ./tool/data:/app/data
      - ./doc:/app/doc:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/jobs"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - prm-network

  # ==============================================================================
  # 3. Spring Boot Backend Service (Java 21)
  # ==============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      tool:
        condition: service_healthy
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - TOOL_URL=http://tool:8000
    ports:
      - "8080:8080"
    networks:
      - prm-network

volumes:
  prm_postgres_data:
    external: true

networks:
  prm-network:
    name: prm-network
    driver: bridge
